version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18-alpine
    container_name: ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-recruitment_system}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-recruitment_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  # Redis（BullMQ 队列与缓存）
  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats_network

  # 后端 API 服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ats_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-recruitment_system}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-min-32-chars!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - ats_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PC 前端构建
  client-build:
    image: node:20-alpine
    container_name: ats_client_build
    working_dir: /app
    volumes:
      - ./client:/app
      - client_dist:/app/dist
    command: >
      sh -c "npm install && npm run build"
    networks:
      - ats_network
    profiles:
      - build

  # 移动端构建
  mobile-build:
    image: node:20-alpine
    container_name: ats_mobile_build
    working_dir: /app
    volumes:
      - ./mobile:/app
      - mobile_dist:/app/dist
    command: >
      sh -c "npm install && npm run build"
    networks:
      - ats_network
    profiles:
      - build

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: ats_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - client_dist:/var/www/client:ro
      - mobile_dist:/var/www/mobile:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - ats_network

volumes:
  postgres_data:
  redis_data:
  client_dist:
  mobile_dist:

networks:
  ats_network:
    driver: bridge
